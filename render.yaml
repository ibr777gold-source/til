services:
  - type: web
    name: til-api
    runtime: python
    plan: free
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: cd app/backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: til-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_DEMO_CONTENT
        value: "true"
      - key: PRACTICE_REVISION_KEY
        generateValue: true

databases:
  - name: til-db
    plan: free
