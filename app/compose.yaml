services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: til
      POSTGRES_PASSWORD: til_dev_password
      POSTGRES_DB: til
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - til_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U til -d til"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  til_postgres:
